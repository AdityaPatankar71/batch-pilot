# batch-pilot console: opt-in, served at /batch-pilot
batch-pilot.enabled=true

# In-memory H2 holds the BATCH_* metadata for the demo run
spring.datasource.url=jdbc:h2:mem:batchpilot;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create the Spring Batch metadata schema on startup
spring.batch.jdbc.initialize-schema=always

# Don't auto-run jobs; DemoDataLoader launches them with unique parameters
spring.batch.job.enabled=false

spring.application.name=batch-pilot-sample-app
server.port=8080
